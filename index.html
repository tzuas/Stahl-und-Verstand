<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ok:#5cc28a; --warn:#e3a43a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --panel:#1c2226; --ink:#e7ebee; --muted:#98a4ad; --line:#323b42;

  --ok:#5cc28a; --warn:#e3a43a; color-scheme:dark}
*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#aiFab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 18px));z-index:50;display:flex;align-items:center;gap:8px;padding:14px 20px 14px 16px;border-radius:999px;background:var(--steel);color:var(--bg);border:none;font:700 15px var(--f-body);box-shadow:0 6px 20px rgba(0,0,0,.25);min-height:56px}

/* Laufender Entwurf (sv-draft) bewusst in sessionStorage statt
   localStorage: Nutzer-Wunsch "vor Ort soll alles am Anfang anfangen,
   nicht beim letzten Kunden vorher" - ein neuer App-Start (App/Browser

   leerem Kundenfeld beginnen, nicht automatisch die Daten des letzten
   Kunden laden. sessionStorage übersteht aber ein versehentliches
   Neuladen INNERHALB desselben Tabs/derselben Sitzung, damit man bei
   einem Reload mitten in der Aufnahme nicht alles verliert. Explizit
   gespeicherte Beratungen (sv-list, über "Beratung speichern") bleiben
   dauerhaft in localStorage und lassen sich jederzeit gezielt öffnen. */
function loadSess(k,d){try{const v=JSON.parse(sessionStorage.getItem(k)||"null");return v??d}catch(e){return d}}
function storeSess(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function stateExportUrl(){
 const data=Object.assign({},S);delete data.photo;delete data._id;
 const json=JSON.stringify(data);
 const b64=btoa(unescape(encodeURIComponent(json)));
 const u=new URL(location.href);u.search="";u.hash="";
 u.searchParams.set("import",b64);
 return u.toString();
}
(function importFromLink(){
 const params=new URLSearchParams(location.search);
 const imp=params.get("import");
 if(imp){
  try{
   const json=decodeURIComponent(escape(atob(imp)));
   const data=JSON.parse(json);
   if(confirm("Übernommenen Stand von einem anderen Gerät/Browser laden (Produkt, Maße, Kunde)? Der aktuelle Entwurf hier wird dabei ersetzt.")){

   }
  }catch(e){}
  params.delete("import");
  const qs=params.toString();
  history.replaceState(null,"",location.pathname+(qs?"?"+qs:"")+location.hash);
 }

 return{std,exp,why:ps.map(x=>x.why).filter(Boolean)}}

/* Bosch-Laser-Entfernungsmesser per Web Bluetooth (z. B. Universal Distance /
   GLM-Serie 50C): Protokoll reverse-engineered, Quelle siehe Commit-Notiz.
   Nicht am echten Gerät getestet - vor Ort einmal ausprobieren.
   GATT-Dienst 0xFDE8 (Bosch), eine Characteristic für Write + Notify.
   Frame: C0 55 <len> <payload...> <crc8>. Payload: u16 Typ, u16 Zähler,
   f32 Wert (LE), 8 Byte reserviert. Typ 0x0006 = Distanz in Metern.
   CRC-8: Poly 0xA6, Start 0xAA, kein Reflect, kein Final-XOR.
   Auf iPhone/iPad funktioniert Web Bluetooth nur über die App "Bluefy",
   nicht in Safari oder Chrome (nutzt dieselbe WebKit-Engine wie Safari). */
const LASER_SERVICE="0000fde8-0000-1000-8000-00805f9b34fb";
const LASER_CHAR="02a6c0d2-0451-4000-b000-fb3210111989";
/* Beim Universal Distance 50C des Nutzers live entdeckt (0xFDE8 war nur
   die Annahme vom AD 50C, trifft hier nicht zu) - als zweiter Versuch: */
const LASER_SERVICE_ALT="00005301-0000-0041-5253-534f46564000";
const LASER_STD_SERVICES=new Set(["00001800-0000-1000-8000-00805f9b34fb","00001801-0000-1000-8000-00805f9b34fb","0000180a-0000-1000-8000-00805f9b34fb","0000180f-0000-1000-8000-00805f9b34fb"]);
let laser={state:"idle",name:"",msg:""};
function laserCrc8(bytes){let crc=0xAA;for(let i=0;i<bytes.length;i++){crc^=bytes[i];for(let b=0;b<8;b++)crc=(crc&0x80)?((crc<<1)^0xA6)&0xFF:(crc<<1)&0xFF}return crc}
function laserButtonHtml(){
 const busy=laser.state==="connecting",on=laser.state==="connected";
 return `<div class="row" style="margin:6px 0 2px"><button type="button" id="btnLaser"${busy?" disabled":""}>${on?`Laser verbunden (${esc(laser.name||"Bosch")}) · trennen`:busy?"Verbinde …":"📡 Laser verbinden (Bluetooth)"}</button></div>
 <p class="hint" id="laserMsg" style="margin-top:0">${esc(laser.msg||"Bosch-Laser mit Bluetooth: Taste antippen, Gerät auswählen. Danach landet jede Messung automatisch im zuletzt angetippten Maßfeld. Auf iPhone/iPad nur über die kostenlose App „Bluefy“ möglich, nicht in Safari oder Chrome.")}</p>`;
}
function laserUiRefresh(){
 const b=$("#btnLaser");if(!b)return;
 const busy=laser.state==="connecting",on=laser.state==="connected";
 b.disabled=busy;
 b.textContent=on?`Laser verbunden (${laser.name||"Bosch"}) · trennen`:busy?"Verbinde …":"📡 Laser verbinden (Bluetooth)";
 const m=$("#laserMsg");if(m)m.textContent=laser.msg||"";
}
async function laserToggle(){
 if(laser.state==="connected"){laserDisconnect();return}
 if(!navigator.bluetooth){laser.msg="Web Bluetooth nicht verfügbar. Auf dem iPad bitte die kostenlose App „Bluefy“ installieren und den Kalkulator dort öffnen.";laserUiRefresh();return}
 /* Nach einem fehlgeschlagenen Versuch kann noch eine halboffene
    GATT-Verbindung vom vorigen Gerät bestehen, die neue Versuche
    blockiert - vorsorglich trennen. */
 try{laser.dev&&laser.dev.gatt&&laser.dev.gatt.disconnect()}catch(e){}
 try{
  laser.state="connecting";laser.msg="Bluetooth-Geräteauswahl wird geöffnet …";laserUiRefresh();
  /* acceptAllDevices statt Filter: Viele BLE-Geräte (auch Bosch-Laser)
     senden ihre Dienst-UUID nicht im Werbepaket, sondern erst nach dem
     Verbinden - ein Filter nach Dienst hätte das Gerät darum nicht
     zuverlässig gezeigt. Jetzt, wo der tatsächliche Gerätename bekannt
     ist (vom Nutzer bestätigt: "Bosch UD 50C x8252"), wird stattdessen
     nach Namen gefiltert, damit in der Auswahl nur Bosch-Laser
     erscheinen und nicht jedes Bluetooth-Gerät in der Nähe. */
  const device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"Bosch UD"},{namePrefix:"Bosch GLM"},{namePrefix:"GLM"},{namePrefix:"AD 50"},{namePrefix:"Universal Distance"}],optionalServices:[LASER_SERVICE,LASER_SERVICE_ALT]});
  laser.name=device.name||"Laser";
  device.addEventListener("gattserverdisconnected",()=>{laser.state="idle";laser.char=null;laser.msg="Laser getrennt.";laserUiRefresh()});
  laser.msg="Verbinde mit "+laser.name+" … (GATT)";laserUiRefresh();
  const server=await device.gatt.connect();
  laser.msg="Verbunden, suche Bosch-Dienst …";laserUiRefresh();
  /* Dienst automatisch finden: zuerst die beiden bekannten Vermutungen
     (0xFDE8 vom AD 50C, dann die beim Universal Distance 50C live
     entdeckte UUID), sonst alle erlaubten Dienste auflisten und den
     ersten nehmen, der kein generischer Standard-Dienst ist. */
  let service=null,usedUuid="";
  for(const uuid of [LASER_SERVICE,LASER_SERVICE_ALT]){
   try{service=await server.getPrimaryService(uuid);usedUuid=uuid;break}catch(e){}
  }
  if(!service){
   const all=await server.getPrimaryServices().catch(()=>[]);
   const custom=all.filter(s=>!LASER_STD_SERVICES.has(s.uuid));
   if(!custom.length)throw new Error("Kein Bosch-Dienst gefunden. Erlaubte/vorhandene Dienste: "+(all.map(s=>s.uuid).join(", ")||"(keine)"));
   service=custom[0];usedUuid=service.uuid;
  }
  laser.msg="Dienst "+usedUuid+" gefunden, suche Characteristic …";laserUiRefresh();
  const chars=await service.getCharacteristics();
  const propList=c=>Object.keys(c.properties||{}).filter(k=>c.properties[k]).join(",");
  const info=chars.map(c=>c.uuid+" ["+propList(c)+"]").join(" | ");
  /* "indicate" ist wie "notify" ein abonnierbarer Benachrichtigungstyp
     (startNotifications() funktioniert fuer beide gleich) - manche
     Bosch-Geraete (z. B. dieses Universal Distance 50C) nutzen indicate
     statt notify, darum hier beides akzeptieren. */
  let ch=chars.find(c=>c.properties&&(c.properties.notify||c.properties.indicate)&&(c.properties.write||c.properties.writeWithoutResponse));
  if(!ch)ch=chars.find(c=>c.properties&&(c.properties.notify||c.properties.indicate));
  if(!ch)throw new Error("Keine Characteristic mit Notify/Indicate gefunden im Dienst "+usedUuid+". Vorhanden: "+info);
  await ch.startNotifications();
  ch.addEventListener("characteristicvaluechanged",laserOnData);
  let hs="";
  try{
   if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]));
   else if(ch.properties.write)await ch.writeValue(new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]));
   else hs="(keine Schreibrechte, kein Start-Befehl nötig/möglich) ";
   if(!hs)hs="Start-Befehl ok. ";
  }catch(e){hs="Start-Befehl fehlgeschlagen ("+(e&&e.message||e)+") - evtl. nicht nötig. "}
  laser.dev=device;laser.char=ch;laser.state="connected";
  laser.msg="Verbunden mit "+laser.name+" (Dienst "+usedUuid+", Characteristic "+ch.uuid+"). Gefundene Characteristics: "+info+". "+hs+"Jetzt messen - der Wert landet im zuletzt angetippten Maßfeld.";
  laserUiRefresh();
 }catch(err){
  laser.state="idle";
  if(err&&err.name==="NotFoundError"){laser.msg="Keine Auswahl getroffen."}
  else{
   const detail=[err&&err.name,err&&err.message].filter(x=>x&&String(x).trim()).join(": ")||String(err);
   laser.msg="Verbindung fehlgeschlagen ("+detail+"). Tipp: Laser einmal aus- und wieder einschalten (nicht nur die Bluetooth-Taste erneut drücken) und am iPad Bluetooth in der Seitenleiste kurz aus/an schalten - BLE-Geräte "+
    "denken nach einem fehlgeschlagenen Verbindungsversuch manchmal, sie seien noch verbunden, und lehnen den nächsten Versuch ab. Danach hier erneut auf „Laser verbinden“ tippen.";
  }
  laserUiRefresh();
 }
}
function laserDisconnect(){try{laser.dev&&laser.dev.gatt&&laser.dev.gatt.disconnect()}catch(e){}laser.state="idle";laser.char=null;laser.msg="Getrennt.";laserUiRefresh()}
function laserHex(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join(" ")}
/* Diagnose-Modus: Solange nicht sicher ist, dass das Protokoll fuer das
   Universal Distance 1:1 passt, zeigt jede eingehende Bluetooth-
   Benachrichtigung ihre Rohdaten direkt unter dem Laser-Button an - auch
   wenn das Parsen fehlschlaegt. Damit laesst sich der Fehler ohne
   Entwicklertools auf dem iPad diagnostizieren (Nutzer liest die Meldung
   ab und gibt sie durch). Sobald das Protokoll bestaetigt ist, kann die
   ausfuehrliche Meldung wieder auf den reinen Messwert reduziert werden. */
function laserOnData(e){
 const dv=e.target.value;
 const bytes=new Uint8Array(dv.buffer.slice(dv.byteOffset,dv.byteOffset+dv.byteLength));
 const hex=laserHex(bytes);
 console.log("[Laser] Notification ("+bytes.length+" Byte): "+hex);
 if(bytes.length<12||bytes[0]!==0xC0||bytes[1]!==0x55){laser.msg="Unbekannte Bluetooth-Daten ("+bytes.length+" Byte): "+hex;laserUiRefresh();return}
 const len=bytes[2];
 if(bytes.length<3+len+1){laser.msg="Frame zu kurz (len="+len+", "+bytes.length+" Byte): "+hex;laserUiRefresh();return}
 const crcByte=bytes[3+len],calcCrc=laserCrc8(bytes.slice(0,3+len));
 if(calcCrc!==crcByte){laser.msg="CRC passt nicht (erwartet "+calcCrc.toString(16)+", erhalten "+crcByte.toString(16)+"): "+hex;laserUiRefresh();return}
 const payload=bytes.slice(3,3+len);
 if(payload.length<8){laser.msg="Payload zu kurz ("+payload.length+" Byte): "+hex;laserUiRefresh();return}
 /* Typ-Code ist geräteabhängig (beim Universal Distance 50C z. B. 0x0406
    statt der beim AD 50C dokumentierten 0x0006) - darum nicht mehr auf
    einen festen Typ pruefen, sondern jeden Wert akzeptieren, der wie eine
    plausible Distanz aussieht (0 bis 300 m). CRC ist bereits geprüft,
    das Rahmenformat (C0 55 ...) ist damit bestätigt korrekt. */
 const type=payload[0]|(payload[1]<<8);
 const pdv=new DataView(payload.buffer,payload.byteOffset+4,4);
 const meters=pdv.getFloat32(0,true);
 if(!isFinite(meters)||meters<0||meters>300){laser.msg="Messtyp 0x"+type.toString(16)+", unplausibler Wert ("+meters+"): "+hex;laserUiRefresh();return}
 laserApply(meters,type);
}
function laserApply(meters,type){
 const typeTag=type!==undefined?" (Typ 0x"+type.toString(16)+")":"";
 const cmVal=meters*100,panel=$("#panel"),el=document.activeElement;
 const ok=el&&panel&&panel.contains(el)&&el.tagName==="INPUT"&&el.type==="number"&&(el.dataset.k!==undefined||el.dataset.len!==undefined||el.dataset.mval!==undefined);
 if(!ok){laser.msg="Messung: "+cmVal.toFixed(1)+" cm"+typeTag+" - bitte zuerst ins gewünschte Maßfeld tippen.";laserUiRefresh();return}
 const unitSpan=el.closest(".unit")?.querySelector("span:last-child");
 const unit=((unitSpan&&unitSpan.textContent)||"").trim().toLowerCase();
 if(unit&&unit!=="cm"){laser.msg="Messung: "+cmVal.toFixed(1)+" cm"+typeTag+" - aktives Feld erwartet "+unit+", nicht übernommen.";laserUiRefresh();return}
 const elId=el.id;
 el.value=String(Math.round(cmVal*10)/10);
 el.dispatchEvent(new Event("input",{bubbles:true}));
 el.dispatchEvent(new Event("change",{bubbles:true}));
 /* change-Handler kann refresh(true) ausloesen und #panel komplett neu
    aufbauen (Race-Condition!) - "el" ist danach u.U. ein verwaistes,
    aus dem DOM entferntes Knoten. Deshalb hier ueber die id im FRISCH
    gerenderten DOM nachschlagen statt die alte Referenz weiterzunutzen. */
 laser.msg="Übernommen: "+cmVal.toFixed(1)+" cm"+typeTag;
 laserUiRefresh();
 laserFocusNext(elId);
}

 if(i>-1&&i+1<list.length){const nxt=list[i+1];setTimeout(()=>{nxt.focus();nxt.select&&nxt.select()},50)}

/* ---------- Geometrie ---------- */
const VB={w:820,h:400,l:80,r:30,t:56,b:78};
function curveOff(t,H,s,form){
 const k=Math.min(H*.18,22*s);
 switch(form){case"Bogen":return -k*Math.sin(Math.PI*t);case"Geschwungen":return -k*Math.pow(Math.sin(Math.PI*t),2);case"U-Form":return k*Math.sin(Math.PI*t);default:return 0}
}
function tipShape(tip,x,y,s){
 const r=Math.max(2.2,3*s);if(tip==="Ohne Spitze")return"";
 if(tip.startsWith("Kugel"))return `<circle cx="${x}" cy="${y-r}" r="${r}" class="fillD"/>`+(tip==="Kugellilie"?`<path d="M${x} ${y-2*r} l-${r} -${r*1.6} M${x} ${y-2*r} l${r} -${r*1.6} M${x} ${y-2*r} v-${r*2}"/>`:"");
 if(tip==="Lilie"||tip==="Kreuzlilie")return `<path class="fillD" d="M${x} ${y-r*3.4} l${r*.8} ${r*2.2} h-${r*1.6}z"/><path d="M${x-r*1.6} ${y-r*2.2} q${r*.6} ${r*1.4} ${r*1.6} ${r*1.2} q${r} .2 ${r*1.6} -${r*1.2}"/>`+(tip==="Kreuzlilie"?`<line x1="${x-r*1.4}" y1="${y-r*1.2}" x2="${x+r*1.4}" y2="${y-r*1.2}"/>`:"");
 if(tip==="Lotus"||tip==="Pinie")return `<path class="fillD" d="M${x-r*.9} ${y} q-.2 -${r*2.4} ${r*.9} -${r*3.4} q${r*1.1} ${r} ${r*.9} ${r*3.4}z"/>`;
 if(tip==="Stab")return `<path class="fillD" d="M${x-r*.5} ${y} l${r*.5} -${r*3} l${r*.5} ${r*3}z"/><circle cx="${x}" cy="${y-r*.6}" r="${r*.7}" class="fillD"/>`;
 return `<path class="fillD" d="M${x-r} ${y} l${r} -${r*3.2} l${r} ${r*3.2}z"/>`;
}
function drawRailing(m,o,x,w,H,y0,s,spanX,spanW){
 const fill=o.fill||"Wie Modell",noDeco=fill!=="Wie Modell",empty=fill.startsWith("Ohne Füllung");
 const d=m.deco,out=[];
 const base=y0-6*s, botRail=base-8*s;
 const top=xx=>y0-H+curveOff((xx-spanX)/spanW,H,s,o.form);
 const spikes=m.sp&&o.tip!=="Ohne Spitze"&&!empty;
 const railDrop=spikes?14*s:0;
 const line=(off,n=24)=>{let a=[];for(let i=0;i<=n;i++){const xx=x+w*i/n;a.push(`${xx.toFixed(1)},${(top(xx)+railDrop+off).toFixed(1)}`)}return `<polyline points="${a.join(" ")}" class="rail"/>`};
 const box=["frame","salerno","horiz","glas","lochblech","scala"].includes(d);
 if(empty){out.push(line(0),`<line x1="${x}" y1="${botRail}" x2="${x+w}" y2="${botRail}" class="rail"/>`,`<line x1="${x}" y1="${top(x)+railDrop}" x2="${x}" y2="${botRail}" class="rail"/>`,`<line x1="${x+w}" y1="${top(x+w)+railDrop}" x2="${x+w}" y2="${botRail}" class="rail"/>`);return out.join("")}
 if(box)out.push(`<rect x="${x}" y="${top(x)}" width="${w}" height="${base-top(x)}" class="thick"/>`);
 else{
  out.push(`<line x1="${x}" y1="${botRail}" x2="${x+w}" y2="${botRail}" class="rail"/>`,line(0));
  if(!noDeco&&["x","circle","c","s","volute"].includes(d))out.push(line(20*s));
  if(d==="molveno")out.push(line(7*s));
  if(!noDeco&&d==="x")out.push(line(40*s));
 }
 const gap=(d==="modena"||d==="molveno"||m.st[0].startsWith("25"))?11:(m.st[0].startsWith("40")?13:12);
 const n=Math.max(2,Math.round(w/(gap*s)));
 if(d==="horiz"){for(let yy=top(x)+10*s;yy<base-4*s;yy+=10*s)out.push(`<line x1="${x}" y1="${yy}" x2="${x+w}" y2="${yy}" class="bar"/>`);return out.join("")}
 /* Inox Weber-Füllungsarten (siehe MODELS unten): Seilzug, rahmenlose
    Glasfüllung, durchbrochenes Lochblech - eigenständig zur Vorlage
    gezeichnet, nicht aus deren Konfigurator kopiert. */
 if(d==="seil"){for(let yy=top(x)+8*s;yy<base-4*s;yy+=7*s)out.push(`<line x1="${x}" y1="${yy}" x2="${x+w}" y2="${yy}" class="bar" style="stroke-width:1"/>`);return out.join("")}
 if(d==="glas"){out.push(`<rect x="${x+2}" y="${top(x)+2}" width="${w-4}" height="${base-top(x)-2}" fill="#bcd7e0" opacity=".35"/>`,`<rect x="${x}" y="${base-9*s}" width="${w}" height="${9*s}" class="fillD"/>`);return out.join("")}
 if(d==="lochblech"){
  out.push(`<rect x="${x}" y="${top(x)}" width="${w}" height="${base-top(x)}" class="fillD" opacity=".9"/>`);
  const step=Math.max(6,10*s),by=top(x),bh=base-top(x);
  for(let yy=by+step*.6;yy<by+bh-2;yy+=step)for(let xx=x+step*.6;xx<x+w-2;xx+=step)out.push(`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(step*.28).toFixed(1)}" fill="#fff" opacity=".55"/>`);
  return out.join("")
 }
 if(d==="salerno"){const mid=x+w*.45;for(let i=1;i<6;i++){const xx=x+(mid-x)*i/6;out.push(`<line x1="${xx}" y1="${top(x)}" x2="${xx}" y2="${base}" class="bar"/>`)}out.push(`<line x1="${mid}" y1="${top(x)}" x2="${mid}" y2="${base}" class="thick"/>`);for(let yy=top(x)+12*s;yy<base-4*s;yy+=12*s)out.push(`<line x1="${mid}" y1="${yy}" x2="${x+w}" y2="${yy}" class="bar"/>`);return out.join("")}
 /* Scala (siehe MODELS oben): Modulraster aus senkrechten und waagerechten
    Flachstahl-Trennern, eigenständig zur Vorlage gezeichnet. */
 if(d==="scala"){
  const cols=Math.max(2,Math.round(w/(22*s)));
  for(let i=1;i<cols;i++){const xx=x+w*i/cols;out.push(`<line x1="${xx}" y1="${top(x)}" x2="${xx}" y2="${base}" class="bar"/>`)}
  const rows=Math.max(1,Math.round((base-top(x))/(18*s)));
  for(let j=1;j<rows;j++){const yy=top(x)+(base-top(x))*j/rows;out.push(`<line x1="${x}" y1="${yy}" x2="${x+w}" y2="${yy}" class="bar"/>`)}
  return out.join("")
 }
 for(let i=1;i<n;i++){
  const xx=x+w*i/n;let ty=box?top(x):top(xx);
  if(!noDeco&&d==="lana"&&i%2===0)ty+=10*s;
  out.push(`<line x1="${xx}" y1="${ty}" x2="${xx}" y2="${box?base:botRail}" class="${d==="modena"&&i%6===0?"thick":"bar"}"/>`);
  if(spikes)out.push(tipShape(o.tip,xx,ty,s));
  if(noDeco)continue;
  const ry=top(xx)+railDrop,cx=xx+w/n/2,r=Math.min(w/n/2,9*s)*.85,cy=ry+10*s;
  if(d==="short"||m.n==="Lucca")out.push(`<line x1="${cx}" y1="${botRail}" x2="${cx}" y2="${botRail-Math.min(28*s,H*.3)}" class="bar"/>`);
  if(d==="circle"&&i%2)out.push(`<circle cx="${cx}" cy="${cy}" r="${r}"/>`);
  if(d==="c"&&i%2)out.push(`<path d="M${cx-r} ${cy-r} a${r} ${r} 0 1 0 0 ${2*r} M${cx+r} ${cy-r} a${r} ${r} 0 1 1 0 ${2*r}"/>`);
  if(d==="s"&&i%2)out.push(`<path d="M${cx-r*1.6} ${cy+r} c0 -${r*2} ${r*1.6} -${r*2} ${r*1.6} 0 s${r*1.6} ${r*2} ${r*1.6} 0"/>`);
  if(d==="volute"&&i%3===1)out.push(`<path d="M${cx-r*2} ${cy} a${r} ${r} 0 1 1 ${r*.8} ${r*.8} M${cx+r*2} ${cy} a${r} ${r} 0 1 0 -${r*.8} ${r*.8} M${cx-r*1.2} ${cy+r*.8} q${r*1.2} -${r*1.8} ${r*2.4} 0"/>`);
  if(d==="x")out.push(`<path d="M${xx} ${ry+20*s} L${xx+w/n} ${ry+40*s} M${xx+w/n} ${ry+20*s} L${xx} ${ry+40*s}"/>`);
  const midY=(ry+botRail)/2;
  if(d==="rhomb"&&i%3===2){const q=Math.max(4,7*s);out.push(`<path d="M${xx} ${midY-q*1.4} l${q} ${q*1.4} l-${q} ${q*1.4} l-${q} -${q*1.4}z"/>`)}
  if(d==="orn"&&i%2)out.push(`<ellipse cx="${xx}" cy="${midY}" rx="${Math.max(2.5,4*s)}" ry="${Math.max(5,9*s)}"/>`);
 }
 return out.join("");
}
/* Dekormotiv-Rohform, ohne Wrapper - wird für die 2D-SVG-<pattern> UND für
   die 3D-Textur (Sichtschutz-Muster auf dem Panel) verwendet, damit beide
   Ansichten exakt dasselbe Motiv zeigen (siehe patternTexture() weiter unten). */
function patBody(p){
 if(p==="geo")return `<path d="M0 24 L24 0 M0 12 L12 0 M12 24 L24 12"/>`;
 if(p==="wave")return `<path d="M0 6 q6 -6 12 0 t12 0 M0 18 q6 -6 12 0 t12 0"/>`;
 if(p==="leaf"||p==="leaf2"||p==="palm")return `<ellipse cx="12" cy="12" rx="${p==="palm"?3:4}" ry="10" transform="rotate(${p==="leaf2"?25:-30} 12 12)"/><line x1="4" y1="20" x2="20" y2="4"/>`;
 if(p==="rhomb")return `<path d="M12 2 L22 12 L12 22 L2 12z M12 7 L17 12 L12 17 L7 12z"/>`;
 if(p==="flower")return `<circle cx="12" cy="12" r="2.5"/>${[0,60,120,180,240,300].map(a=>`<ellipse cx="12" cy="6.5" rx="2" ry="3.6" transform="rotate(${a} 12 12)"/>`).join("")}`;
 return"";
}
function patternDef(m,id,sc=1){
 const z=24*sc;
 return `<pattern id="${id}" width="${z}" height="${z}" patternUnits="userSpaceOnUse"><g class="pat" transform="scale(${sc})">${patBody(m.pat)}</g></pattern>`;
}
/* Anlage als SVG-Gruppe (ohne Bemaßung) */
function fieldXs(L,s,x0){const pw=Math.max(3,L.post*s);let x=x0;const posts=[],starts=[];for(let i=0;i<L.n;i++){posts.push(x);x+=pw;starts.push(x);x+=L.fields[i]*s}posts.push(x);return{posts,starts,pw}}
function fence(m,o,L,s,x0,y0,H,patId){
 const g=[],pw=Math.max(3,L.post*s),postH=H+(o.product==="Tor"?12:4)*s;
 const X=L.gate?null:fieldXs(L,s,x0);
 if(o.screen){
  X.starts.forEach((x,i)=>{const w=L.fields[i]*s,top=y0-H,base=y0-4*s;
   const pt=o.screenVar==="teil"&&m.p?top+(base-top)*.3:base;
   g.push(`<rect x="${x}" y="${top}" width="${w}" height="${base-top}" class="panel"/>`);
   if(m.pat!=="none")g.push(`<rect x="${x+3}" y="${top+3}" width="${w-6}" height="${pt-top-6}" style="fill:url(#${patId});stroke:none" class="patfill"/>`);
   g.push(`<rect x="${x}" y="${top}" width="${w}" height="${base-top}" class="thick"/>`)});
 }else if(L.gate){
  const span=x0+pw,spanW=L.clear*s,cv=xx=>y0-H+curveOff((xx-span)/spanW,H,s,o.form);
  const leaves=o.product==="Tor"?[[span+2*s,(spanW-4*s)/2-2*s],[span+(spanW-4*s)/2+4*s,(spanW-4*s)/2-2*s]]:[[span+2*s,spanW-4*s]];
  leaves.forEach(([lx,lw])=>{g.push(drawRailing(m,o,lx,lw,H,y0,s,span,spanW));[lx,lx+lw].forEach(xx=>g.push(`<line x1="${xx}" y1="${cv(xx)}" x2="${xx}" y2="${y0-6*s}" class="thick"/>`))});
  const lk=o.product==="Tor"?span+spanW/2-3:(o.hinge==="links"?span+spanW-8:span+2);
  if(o.lock!=="Ohne Schloss")g.push(`<rect x="${lk}" y="${y0-H*.55}" width="6" height="${Math.max(10,14*s)}" class="lock"/>`);
 }else{
  X.starts.forEach((x,i)=>g.push(drawRailing(m,o,x,L.fields[i]*s,H,y0,s,x,L.fields[i]*s)));
 }
 const rail=o.product==="Geländer"||o.product==="Französischer Balkon",front=o.mount==="Stirnseitig"||o.mount==="Vor der Fassade";
 if(o.posts!=="Keine Pfosten"||rail){
  const ps=L.gate?[x0,x0+L.width*s-pw]:X.posts;
  ps.forEach((x,i)=>{
   const yb=front?y0+(o.slabPx||14)*.9:y0;
   g.push(`<rect x="${x}" y="${y0-postH}" width="${pw}" height="${yb-y0+postH}" class="post${!L.gate&&L.corners.includes(i)?" corner":""}"/>`);
   g.push(`<rect x="${x-pw*.15}" y="${y0-postH-Math.max(1.5,1.2*s)}" width="${pw*1.3}" height="${Math.max(1.5,1.2*s)}" class="fillD"/>`);
   if(rail&&!front)g.push(`<rect x="${x-pw*.6}" y="${y0-Math.max(1.5,1*s)}" width="${pw*2.2}" height="${Math.max(1.5,1*s)}" class="fillD"/>`);
   if(rail&&front&&o.product==="Geländer")[.3,.7].forEach(t=>g.push(`<rect x="${x-pw*.3}" y="${y0+(o.slabPx||14)*t-1.5}" width="${pw*1.6}" height="3" class="fillD"/>`));
  });
 }
 return g.join("");

function modelBadges(m){

function svgToImg(el,light,cb){

  const out=new Image();out.src=c.toDataURL("image/png");cb(out)};

}

function solve(A,b){const n=b.length;A=A.map((r,i)=>[...r,b[i]]);

function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return solve(A,b)}

function tri(ctx,img,s,d){

 const det=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);if(!det)return;
 const A=(u0*(y1-y2)+u1*(y2-y0)+u2*(y0-y1))/det,C=(x0*(u1-u2)+x1*(u2-u0)+x2*(u0-u1))/det,E=(x0*(y1*u2-y2*u1)+x1*(y2*u0-y0*u2)+x2*(y0*u1-y1*u0))/det;

const AI_FIELDS=["product","model","coat","ral","form","tip","fill","bar","height","total","fields","posts","mount","slab","express","screenMat","screenVar","wishText","notes","shipNote","cFirst","cLast","cStreet","cZip","cCity","cPhone","cMail","step","view"];
function aiApply(ch){
 if(!ch||typeof ch!=="object")return [];
 const done=[];let view=null;
 for(const k of AI_FIELDS){if(!(k in ch))continue;let v=ch[k];
  if(k==="view"){if(["look","tech","3d"].includes(v))view=v;continue}
  if(["height","total","fields","slab","step"].includes(k)){v=+v;if(!isFinite(v))continue;if(k==="step")v=Math.max(0,Math.min(STEPS.length-1,Math.round(v)))}
  if(k==="express")v=!!v;
  if(k==="product"&&!PRODUCTS.some(p=>p.id===v))continue;
  if(k==="coat"&&!COATS.includes(v))continue;
  if(k==="ral")v=String(v).replace(/\D/g,"").slice(0,4);
  if(k==="product"&&v!==S.product)S.fields=0;
  S[k]=v;done.push(k);
 }
 if(done.length||view){if(view)S.view=view;refresh(true)}
 return done;
}
async function aiAsk(text){
 if(!text.trim()||AI.busy)return;
 AI.hist.push({role:"user",content:text});AI.hist=AI.hist.slice(-14);
 AI.busy=true;aiRender();
 let raw="";
 try{
  const sys=aiSystem(),msgs=AI.hist.map(m=>({role:m.role,content:m.role==="assistant"?m.json||m.content:m.content}));
  if(aiMode()==="claude"){
   const r=await AI.sample([{role:"user",content:sys+"\n\n--- Gesprächsbeginn ---"},{role:"assistant",content:'{"sagen":"Verstanden.","aendern":null}'},...msgs],{cache:false,modelTier:"default"});raw=r.text||"";
  }else if(aiMode()==="api"){
   const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":aiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:load("sv-ai-model","claude-sonnet-5-5"),max_tokens:700,system:sys,messages:msgs})});
   const j=await res.json();
   if(!res.ok)throw new Error(res.status===401?"Der API-Schlüssel stimmt nicht. Bitte in den Einstellungen prüfen.":res.status===429?"Zu viele Anfragen. Bitte kurz warten.":(j.error&&j.error.message)||"Fehler "+res.status);
   raw=(j.content||[]).map(c=>c.text||"").join("");
  }else throw new Error("Kein KI-Zugang eingerichtet. Tippen Sie auf das Zahnrad.");
  let out={sagen:raw,aendern:null};
  const m=raw.match(/\{[\s\S]*\}/);if(m){try{out=JSON.parse(m[0])}catch(e){}}
  const changed=aiApply(out.aendern);
  AI.hist.push({role:"assistant",content:out.sagen||"…",json:JSON.stringify(out),changed});
  aiSay(out.sagen);
 }catch(e){AI.hist.push({role:"assistant",content:e.code==="not_granted"?"Der KI-Zugriff wurde nicht erlaubt.":String(e.message||e),err:true})}
 AI.busy=false;aiRender();
}

function montageData(){
 return new Promise(resolve=>{
  if(!S.photo)return resolve(null);
  const base=new Image();base.onerror=()=>resolve(null);
  base.onload=()=>{
   const c=document.createElement("canvas");c.width=base.width;c.height=base.height;const ctx=c.getContext("2d");ctx.drawImage(base,0,0);
   ensurePlace();const parts=photoParts();let left=parts.length;
   const done=()=>resolve(c.toDataURL("image/jpeg",.88));
   parts.forEach((p,i)=>{const info=partSvg(p,true),im=new Image();
    im.onload=()=>{const q=S.place[i].map(([x,y])=>[x*c.width,y*c.height]),h=homography([[0,0],[PW,0],[PW,info.H],[0,info.H]],q);
     const cols=24,rows=12,y0=-info.pad,yh=info.H;
     for(let a=0;a<cols;a++)for(let b=0;b<rows;b++){
      const xs=[PW*a/cols,PW*(a+1)/cols],ys=[y0+(yh-y0)*b/rows,y0+(yh-y0)*(b+1)/rows];
      const P=[[xs[0],ys[0]],[xs[1],ys[0]],[xs[1],ys[1]],[xs[0],ys[1]]],S2=P.map(([x,y])=>[x*2,(y+info.pad)*2]),D2=P.map(([x,y])=>hApply(h,x,y));
      tri(ctx,im,[S2[0],S2[1],S2[2]],[D2[0],D2[1],D2[2]]);tri(ctx,im,[S2[0],S2[2],S2[3]],[D2[0],D2[2],D2[3]]);
     }
     if(--left===0)done()};
    im.onerror=()=>{if(--left===0)done()};
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(info.svg)});
  };
  base.src=S.photo;
 });
}

 const box=$("#aiDetect");btn.disabled=true;btn.textContent="KI schaut sich das Bild an …";box.innerHTML="";
 try{
  const jpeg=await frameData();if(!jpeg)throw new Error("Kein Bild vorhanden. Erst Foto machen oder Live-Kamera starten.");
  const want=prodShort();
  const raw=await aiVision(`Du hilfst einem Metallbauer. Auf dem Foto soll ein neuer ${want} geplant werden.
Finde im Bild den vorhandenen Zaun, das Tor, Geländer oder die Grundstücksgrenze/Mauer, an deren Stelle der neue ${want} kommt. Gibt es nichts Vorhandenes, nimm die wahrscheinlichste Linie (z. B. Rasenkante, Mauerkrone, Balkonkante).
Antworte ausschließlich mit JSON:
{"gefunden":true|false,"art":"kurze Beschreibung des Bestands","punkte":[[x,y],[x,y],[x,y],[x,y]],"laenge_cm":Zahl|null,"hoehe_cm":Zahl|null,"sicherheit":"hoch|mittel|niedrig","hinweis":"1 Satz"}
"punkte" = die vier Ecken der Fläche, die der neue ${want} einnehmen soll, als Anteile von Bildbreite und Bildhöhe (0 bis 1), in dieser Reihenfolge: oben links, oben rechts, unten rechts, unten links. Unten = Bodenlinie. Oben = Oberkante des Bestands bzw. ca. ${S.height||100} cm über dem Boden.
Länge und Höhe in cm nur schätzen, wenn ein Maßstab erkennbar ist (Tür ~200 cm hoch, Ziegel, Auto, Zollstock), sonst null.`,jpeg);
  const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error("Die KI hat keine verwertbare Antwort gegeben. Bitte nochmal versuchen.");
  const j=JSON.parse(m[0]);
  const ok=Array.isArray(j.punkte)&&j.punkte.length===4&&j.punkte.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==="number"&&v>=-0.05&&v<=1.05));
  if(!ok)throw new Error("Die KI konnte keine passende Stelle bestimmen. Ziehe die Eckpunkte bitte von Hand.");
  ensurePlace();S.place[S.activePart||0]=j.punkte.map(([x,y])=>[Math.max(0,Math.min(1,x)),Math.max(0,Math.min(1,y))]);
  detectResult=j;save();renderPhotoStep();
  const L=layout(),canDims=(j.laenge_cm>0||j.hoehe_cm>0)&&!L.planned;
  box.innerHTML=`<div class="aibox"><b>${j.gefunden?"Bestand erkannt":"Kein Bestand gefunden, Vorschlag gesetzt"}:</b> ${esc(j.art||"")}${j.hinweis?" · "+esc(j.hinweis):""}<br><span class="hint">Sicherheit: ${esc(j.sicherheit||"?")}. Die Eckpunkte kannst du jederzeit nachziehen.</span>
   ${canDims?`<div class="row" style="margin-top:8px"><span>Geschätzt: ${j.laenge_cm>0?"Länge ca. "+(Math.round(j.laenge_cm/10)/10).toLocaleString("de-DE")+" m":""}${j.laenge_cm>0&&j.hoehe_cm>0?", ":""}${j.hoehe_cm>0?"Höhe ca. "+Math.round(j.hoehe_cm)+" cm":""}</span><button type="button" id="aiDims">Als Maße übernehmen</button></div><p class="hint" style="margin:4px 0 0">Nur eine Schätzung aus dem Bild. Vor der Bestellung immer nachmessen.</p>`:""}</div>`;
 }catch(e){box.innerHTML=`<p class="warn">${esc(e.message||e)}</p>`}
 btn.disabled=false;btn.textContent="KI: Bestand erkennen";
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="aiDetectBtn")planMeasure(b);
 if(b.id==="aiDims"&&detectResult){if(detectResult.laenge_cm>0)S.total=Math.round(detectResult.laenge_cm/5)*5;if(detectResult.hoehe_cm>0)S.height=Math.round(detectResult.hoehe_cm/5)*5;S.fields=0;refresh(false);renderPhotoStep();b.textContent="Übernommen";b.disabled=true}
});
/* ---------- KI-Aufmaßplan: erst Maße zeigen und abfragen, dann Zaun erstellen ---------- */
function measureSvg(W,H){
 const items=S.mplan.items||[],g=[];
 g.push(`<defs><marker id="mArr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffd400"/></marker></defs>`);
 items.forEach((m,i)=>{
  if(!m.von||!m.bis)return;
  const [x1,y1]=[m.von[0]*W,m.von[1]*H],[x2,y2]=[m.bis[0]*W,m.bis[1]*H],mx=(x1+x2)/2,my=(y1+y2)/2,done=+m.wert>0;
  const col=done?"#3ddc84":"#ffd400";
  g.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="7" opacity=".45" stroke-linecap="round"/>`);
  g.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" marker-start="url(#mArr)" marker-end="url(#mArr)" stroke-dasharray="${done?"0":"10 6"}"/>`);
  g.push(`<circle cx="${mx}" cy="${my}" r="16" fill="${col}" stroke="#000" stroke-width="2"/><text x="${mx}" y="${my+6}" text-anchor="middle" style="font:800 17px Archivo,Arial,sans-serif;fill:#000">${esc(m.id||String.fromCharCode(65+i))}</text>`);
  if(done)g.push(`<rect x="${mx+18}" y="${my-13}" width="${String(m.wert).length*10+38}" height="26" rx="5" fill="#000" opacity=".75"/><text x="${mx+26}" y="${my+6}" style="font:600 15px 'IBM Plex Mono',monospace;fill:#fff">${esc(m.wert)} cm</text>`);
 });
 return g.join("");
}
function captureLiveToPhoto(){
 const v=$("#liveVid");if(!LIVE||!v||!v.videoWidth)return false;
 const k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
 c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext("2d").drawImage(v,0,0,c.width,c.height);
 S.photo=c.toDataURL("image/jpeg",.85);stopLive();return true;
}
async function planMeasure(btn){
 const lbl=btn.textContent,box=$("#aiDetect");btn.disabled=true;btn.textContent="KI plant das Aufmaß …";box.innerHTML="";
 try{
  if(LIVE){captureLiveToPhoto();save();refresh(true);btn=$("#aiDetectBtn")||btn;}
  const jpeg=await frameData();if(!jpeg)throw new Error("Kein Bild vorhanden. Erst Foto machen oder Live-Kamera starten.");
  const want=prodShort(),gate=S.product==="Tor"||S.product==="Gartentor",rail=isRail();
  const raw=await aiVision(`Du bist ein erfahrener Metallbauer und planst das Aufmaß für einen neuen ${want} anhand dieses Fotos.
1) Finde die Stelle, an die der neue ${want} kommt (vorhandener Zaun/Tor/Geländer, Mauer, Rasenkante, Balkonkante).
2) Lege fest, welche Maße vor Ort mit Zollstock, Maßband oder Laser gemessen werden müssen, damit das Angebot exakt wird. Schätze NICHTS, frage die Maße ab.
Pflicht: ${gate?"lichte Weite zwischen den Pfeilern/Mauern (typ 'laenge'), gewünschte Torhöhe (typ 'hoehe')":rail?"Länge der Absturzkante je gerader Seite (typ 'laenge'), Geländerhöhe ab Oberkante Boden (typ 'hoehe'), Stärke der Balkonplatte (typ 'platte')":"Länge je gerader Seite entlang der geplanten Linie (typ 'laenge', bei Ecken mehrere), gewünschte Zaunhöhe (typ 'hoehe')"}.
Zusätzlich nur wenn im Bild relevant: Höhenunterschied/Gefälle über die Strecke (typ "gefaelle"), Höhe von Sockel/Mauer (typ "sonstiges"), Pfeilerhöhe, Abstand zu Hindernissen (typ "sonstiges"). Höchstens 6 Maße.
Antworte ausschließlich mit JSON:
{"gefunden":true|false,"art":"kurze Beschreibung des Bestands","punkte":[[x,y],[x,y],[x,y],[x,y]],
 "messungen":[{"id":"A","typ":"laenge|hoehe|gefaelle|platte|sonstiges","titel":"kurz, z. B. Gesamtlänge","anleitung":"wo genau von wo bis wo messen, 1 Satz","von":[x,y],"bis":[x,y]}],
 "hinweis":"1 Satz"}
Alle Koordinaten als Anteile von Bildbreite und -höhe (0 bis 1). "punkte" = Fläche des neuen ${want}: oben links, oben rechts, unten rechts, unten links (unten = Bodenlinie). "von"/"bis" = Start- und Endpunkt der Messlinie im Bild.`,jpeg);
  const mm=raw.match(/\{[\s\S]*\}/);if(!mm)throw new Error("Die KI hat keine verwertbare Antwort gegeben. Bitte nochmal versuchen.");
  const j=JSON.parse(mm[0]);
  const okPt=p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==="number"&&v>=-0.05&&v<=1.05);
  const cl=p=>p.map(v=>Math.max(0,Math.min(1,v)));
  const items=(Array.isArray(j.messungen)?j.messungen:[]).slice(0,6).filter(m=>m&&m.titel).map((m,i)=>({id:String(m.id||String.fromCharCode(65+i)).slice(0,2),typ:m.typ||"sonstiges",titel:String(m.titel),anleitung:String(m.anleitung||""),von:okPt(m.von)?cl(m.von):null,bis:okPt(m.bis)?cl(m.bis):null,wert:""}));
  if(!items.length)throw new Error("Die KI konnte keine Messpunkte bestimmen. Bitte ein Foto machen, auf dem die ganze Strecke zu sehen ist.");
  const place=Array.isArray(j.punkte)&&j.punkte.length===4&&j.punkte.every(okPt)?j.punkte.map(cl):null;
  S.mplan={pending:true,art:j.art||"",hinweis:j.hinweis||"",place,items};
  save();renderPhotoStep();renderPlanBox();
 }catch(e){box.innerHTML=`<p class="warn">${esc(e.message||e)}</p>`}
 const b2=$("#aiDetectBtn");if(b2){b2.disabled=false;b2.textContent=lbl}
}
function mReady(p){const req=p.items.filter(m=>m.typ==="laenge"||m.typ==="hoehe");return (req.length?req:p.items.slice(0,1)).every(m=>+m.wert>0)}
function renderPlanBox(){
 const box=$("#aiDetect");if(!box||!S.mplan||!S.mplan.items)return;
 const p=S.mplan,all=mReady(p);
 box.innerHTML=`<div class="aibox mplan"><b>${p.pending?"Bitte diese Maße messen":"Aufmaß übernommen"}</b>${p.art?" · erkannt: "+esc(p.art):""}
  <p class="hint" style="margin:4px 0 8px">${p.pending?"Die gelben Linien im Foto zeigen, wo gemessen wird. Länge und Höhe sind Pflicht, die übrigen Werte helfen zusätzlich. Danach wird der Zaun erstellt.":"Die Werte stehen im Konfigurator und im Aufmaß-Protokoll der Anfrage."}</p>
  <div class="mlist">${p.items.map((m,i)=>`<label class="mrow"><span class="mid">${esc(m.id)}</span><span class="mtxt"><b>${esc(m.titel)}</b><small>${esc(m.anleitung)}</small></span><span class="unit"><input type="number" inputmode="decimal" data-mval="${i}" value="${esc(m.wert)}" placeholder="cm"><span>cm</span></span></label>`).join("")}</div>
  <div class="row" style="margin-top:10px"><button type="button" class="primary" id="mApply" ${all?"":"disabled"}>${p.pending?"Maße übernehmen und Zaun erstellen":"Maße aktualisieren"}</button><button type="button" id="mDiscard">Aufmaßplan verwerfen</button></div></div>`;
}
function applyMeasure(){
 const p=S.mplan;if(!p)return;
 const v=t=>p.items.filter(m=>m.typ===t&&+m.wert>0).map(m=>+m.wert);
 const L=v("laenge"),H=v("hoehe"),G=v("gefaelle"),P=v("platte");
 const gate=S.product==="Tor"||S.product==="Gartentor";
 if(L.length){
  if(gate){S.total=Math.round(L[0]+20);S.pts=[];S.lens=[]}
  else if(L.length>1){S.lens=L.slice();let x=100,y=300,h=0;S.pts=[[x,y]];L.forEach((len,i)=>{if(i>0)h+=90;const r=h*Math.PI/180;x+=Math.cos(r)*len/100*20;y+=Math.sin(r)*len/100*20;S.pts.push([Math.round(x),Math.round(y)])})}
  else{S.total=L[0];S.pts=[];S.lens=[]}
  S.fields=0;
 }
 if(H.length)S.height=H[0];
 if(G.length){S.slope=G[0];S.slopeUnit="cm"}
 if(P.length)S.slab=P[0];
 const proto=(p.art?"Bestand laut Foto: "+p.art+". ":"")+"Aufmaß vor Ort ("+new Date().toLocaleDateString("de-DE")+"): "+p.items.filter(m=>+m.wert>0).map(m=>`${m.id} ${m.titel} ${m.wert} cm`).join("; ")+(gate&&L.length?" (Gesamtbreite inkl. Torpfosten = lichte Weite + 2 × 10 cm)":"");
 S.notes=[String(S.notes||"").replace(/(Bestand laut Foto: [^.]*\. )?Aufmaß vor Ort \([^)]*\):[^\n·]*/g,"").replace(/^[\s·]+|[\s·]+$/g,""),proto].filter(Boolean).join(" · ");
 ensurePlace();if(p.place)S.place[S.activePart||0]=p.place;
 p.pending=false;save();refresh(false);renderPhotoStep();renderPlanBox();
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="mApply")applyMeasure();
 if(b.id==="mDiscard"){S.mplan=null;save();renderPhotoStep();const x=$("#aiDetect");if(x)x.innerHTML=""}
},true);
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.mval===undefined||!S.mplan)return;
 S.mplan.items[+t.dataset.mval].wert=t.value;save();layoutPhoto();
 const all=mReady(S.mplan),a=$("#mApply");if(a)a.disabled=!all;
});
/* ---------- Preisspanne aus EK (nur auf diesem Gerät gespeichert) ---------- */
const PR_DEF={
 zaun:0, gelaender:0, sichtschutz:0,            /* EK € je laufendem Meter bei 100 cm Höhe (Sichtschutz: bei 180 cm) */
 torGrund:0, torMeter:0, gartentor:0, balkon:0, /* Tor: Grundpreis + € je m Breite; Gartentor/Franz. Balkon € je Stück */
 eck:0, platte:0,                               /* € je Eckpfosten, € je Aufschraubplatte */
 zVerzinkt:0, zRal:0, zForm:0, zExpress:0,      /* Zuschläge in % */
 fracht:0,                                      /* € pauschal je Auftrag */
 montLfm:0, montTor:0,                          /* deine Montagepreise (Verkauf, netto) */
 margeMin:20, margeMax:35, mwst:19, modelle:{}  /* Marge in %, Modell-Abweichungen € je lfm */
};
function prices(){const p=Object.assign({},PR_DEF,load("sv-prices",{}));p.margeMin=Math.max(20,+p.margeMin||20);p.margeMax=Math.max(p.margeMin,+p.margeMax||p.margeMin);return p}
const eur=v=>(Math.round(v)).toLocaleString("de-DE")+" €";
const r50=v=>Math.ceil(v/50)*50;
function posCost(o){
 return withPos(o,()=>{
  const P=prices(),L=layout(),H=(+S.height||100)/100,m=model(),out={ek:0,mont:0,fehlt:"",teile:[]};
  const lfm=L.total/100;
  const rateM=P.modelle&&+P.modelle[S.model]>0?+P.modelle[S.model]:0;
  if(S.product==="Zaun"){const r=rateM||+P.zaun;if(!r)out.fehlt="Zaun € je lfm";out.ek=lfm*r*H;out.teile.push(`${lfm.toLocaleString("de-DE")} lfm × ${eur(r)} × Höhe ${Math.round(H*100)} cm`)}
  else if(S.product==="Geländer"){const r=rateM||+P.gelaender;if(!r)out.fehlt="Geländer € je lfm";out.ek=lfm*r*H;out.teile.push(`${lfm.toLocaleString("de-DE")} lfm Geländer`)}
  else if(S.product==="Sichtschutz"){const r=+P.sichtschutz;if(!r)out.fehlt="Sichtschutz € je lfm";out.ek=lfm*r*((+S.height||180)/180);out.teile.push(`${lfm.toLocaleString("de-DE")} lfm Sichtschutz`)}
  else if(S.product==="Tor"){if(!(+P.torGrund||+P.torMeter))out.fehlt="Tor-Preise";out.ek=(+P.torGrund+(L.total/100)*+P.torMeter)*Math.max(1,H);out.teile.push(`Tor ${cm(L.total)} breit`)}
  else if(S.product==="Gartentor"){if(!+P.gartentor)out.fehlt="Gartentor € je Stück";out.ek=+P.gartentor*Math.max(1,H);out.teile.push("Gartentor")}
  else if(S.product==="Französischer Balkon"){if(!+P.balkon)out.fehlt="Franz. Balkon € je Stück";out.ek=+P.balkon*Math.max(1,lfm/1.2);out.teile.push("Franz. Balkon")}
  if(!L.gate&&L.corners&&L.corners.length&&+P.eck){out.ek+=L.corners.length*+P.eck;out.teile.push(`${L.corners.length} Eckpfosten`)}
  if(S.posts==="Zum Aufschrauben"&&+P.platte){const n=L.gate?2:L.n+1;out.ek+=n*+P.platte;out.teile.push(`${n} Aufschraubplatten`)}
  let z=0;if(S.coat==="Feuerverzinkt")z+=+P.zVerzinkt;if(S.coat==="Sonderfarbe RAL")z+=+P.zRal;if(m.f>1&&S.form!=="Gerade")z+=+P.zForm;if(S.express)z+=+P.zExpress;
  if(z){out.ek*=1+z/100;out.teile.push(`Zuschläge +${z} %`)}
  out.mont=L.gate?+P.montTor:lfm*+P.montLfm;
  return out;
 });
}
function priceCalc(){
 const P=prices(),pos=allPositions(),items=pos.map(o=>({label:posLabel(o),...posCost(o)}));
 const fehlt=items.filter(i=>i.fehlt).map(i=>i.fehlt);
 const ek=items.reduce((a,i)=>a+i.ek,0)+ +P.fracht;
 const mont=items.reduce((a,i)=>a+i.mont,0);
 const vkMin=ek*(1+P.margeMin/100),vkMax=ek*(1+P.margeMax/100),f=1+P.mwst/100;
 return {P,items,fehlt,ek,mont,vkMin,vkMax,f};
}
function priceHtml(){

   <p class="hint" style="margin:2px 0 8px">inkl. ${c.P.mwst} % MwSt. · netto ${eur(r50(c.vkMin))} – ${eur(r50(c.vkMax))} · Material inkl. Lieferung${c.mont>0?`, zzgl. Montage ca. ${eur(r50(c.mont*c.f))} brutto`:""}. Unverbindliche Schätzung, der genaue Preis folgt mit dem Angebot.</p>
   <details class="pdet"><summary>Details nur für dich (EK und Marge)</summary>
    <table class="ptab">${c.items.map((i,n)=>`<tr><td>Pos. ${n+1}: ${esc(i.label)}<br><small>${esc(i.teile.join(" · "))}</small></td><td>${eur(i.ek)}</td></tr>`).join("")}
    ${+c.P.fracht?`<tr><td>Fracht pauschal</td><td>${eur(+c.P.fracht)}</td></tr>`:""}

    <p class="hint">Die Spanne liegt immer mindestens 20 % über deinem EK. Sobald das echte ELEO-Angebot da ist, gilt dessen EK.</p></details>`
  :`<p class="warn" style="margin:0 0 8px">${c.fehlt.length?"Für diese Berechnung fehlen noch EK-Preise: "+esc([...new Set(c.fehlt)].join(", "))+".":"Noch keine EK-Preise hinterlegt."}</p>`}
  <button type="button" id="prOpen">EK-Preise ${ok?"anpassen":"eintragen"}</button></fieldset>`;
}

 <div class="row"><button type="button" class="primary" id="prClose">Fertig</button></div></div>`;

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="prOpen"||b.id==="prHead"){const d=$("#prDlg");d.innerHTML=priceForm();d.hidden=false;window.scrollTo({top:0});return}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {USDZExporter} from "three/addons/exporters/USDZExporter.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";
import {mergeGeometries} from "three/addons/utils/BufferGeometryUtils.js";

const AR_OK=(()=>{try{return document.createElement("a").relList.supports("ar")}catch(e){return false}})();

function material(){
 const f=finish();
 return new THREE.MeshStandardMaterial({color:new THREE.Color(f.c),metalness:f.rust?.15:f.zink?.85:.55,roughness:f.rust?.85:f.zink?.32:.42});
}
/* ---- Bausteine (lokal: x entlang der Anlage, y nach oben, z quer) ---- */
function beam(out,x1,y1,x2,y2,t=.03,d=.02){
 const len=Math.hypot(x2-x1,y2-y1);if(len<1e-3)return;
 const g=new THREE.BoxGeometry(len,t,d);g.rotateZ(Math.atan2(y2-y1,x2-x1));g.translate((x1+x2)/2,(y1+y2)/2,0);out.push(g);
}
function bar(out,x,y1,y2,round,r){
 if(y2-y1<.01)return;
 const g=round?new THREE.CylinderGeometry(r/2,r/2,y2-y1,8):new THREE.BoxGeometry(r,y2-y1,r);
 g.translate(x,(y1+y2)/2,0);out.push(g);
}
function spike(out,x,y,tip){
 let g;
 if(tip.startsWith("Kugel")){g=new THREE.SphereGeometry(.02,10,8);g.translate(x,y+.018,0)}
 else{g=new THREE.ConeGeometry(tip==="Lanze"||tip==="Stab"?.014:.022,tip==="Lanze"?.07:.06,8);g.translate(x,y+.032,0)}
 out.push(g);
}
function ring(out,x,y,r){const g=new THREE.TorusGeometry(r,.005,6,18);g.translate(x,y,0);out.push(g)}

function run(out,m,w,H,offFn){
 const fill=S.fill||"Wie Modell",noDeco=fill!=="Wie Modell",empty=fill.startsWith("Ohne Füllung");
 const d=m.deco,spikes=m.sp&&S.tip!=="Ohne Spitze"&&!empty,drop=spikes?.10:.02;
 const top=x=>H+offFn(x);
 const round=/Hohlrohr|12 mm Massiv/.test(S.bar||""),br=/16 mm/.test(S.bar||"")?.016:/25 × 6/.test(S.bar||"")?.025:/40 × 40/.test(S.bar||"")?.03:.013;
 const box=["frame","salerno","horiz","glas","lochblech","scala"].includes(d);
 const rail=(off)=>{const N=14;for(let i=0;i<N;i++){const a=w*i/N,b=w*(i+1)/N;beam(out,a,top(a)-drop-off,b,top(b)-drop-off,.035,.02)}};
 if(box){beam(out,0,.05,w,.05,.04,.04);beam(out,0,top(0),w,top(w),.04,.04);beam(out,0,.05,0,top(0),.04,.04);beam(out,w,.05,w,top(w),.04,.04)}
 else{beam(out,0,.10,w,.10,.035,.02);rail(0)}
 if(empty){beam(out,0,.10,0,top(0)-drop,.035,.02);beam(out,w,.10,w,top(w)-drop,.035,.02);return}
 if(!box&&!noDeco&&["x","circle","c","s","volute"].includes(d))rail(.2);
 if(!box&&d==="molveno")rail(.07);
 if(!box&&!noDeco&&d==="x")rail(.4);
 if(d==="horiz"){for(let y=.15;y<top(0)-.04;y+=.10)beam(out,0,y,w,y,.03,.03);return}
 /* Inox Weber-Füllungsarten, 3D - vereinfachte, eigenständige Darstellung
    (siehe gleichnamige 2D-Zweige in drawRailing()). Glas/Lochblech werden
    hier als Teil der blickdichten Hauptgeometrie gebaut, ohne eigene
    transparente Textur wie beim Sichtschutz-Muster (patternPlane()) -
    bewusste Vereinfachung, in der 3D-Vorschau also nur als helle Fläche
    statt echtem Glas/echten Löchern sichtbar. */
 if(d==="seil"){for(let y=.12;y<top(0)-.04;y+=.055)beam(out,0,y,w,y,.012,.012);return}
 if(d==="glas"){const g=new THREE.BoxGeometry(w,top(0)-.14,.012);g.translate(w/2,(top(0)-.14)/2+.1,0);out.push(g);beam(out,0,.07,w,.07,.05,.03);return}
 if(d==="lochblech"){const g=new THREE.BoxGeometry(w,top(0)-.12,.01);g.translate(w/2,(top(0)-.12)/2+.08,0);out.push(g);return}
 if(d==="salerno"){const mid=w*.45;for(let i=1;i<6;i++)bar(out,mid*i/6,.05,top(0),false,.025);bar(out,mid,.05,top(0),false,.04);for(let y=.15;y<top(0)-.04;y+=.12)beam(out,mid,y,w,y,.025,.025);return}
 /* Scala (siehe MODELS oben): Modulraster aus senkrechten und waagerechten
    Flachstahl-Trennern, eigenständig zur Vorlage gezeichnet. */
 if(d==="scala"){
  const cols=Math.max(2,Math.round(w/.22));
  for(let i=1;i<cols;i++)bar(out,w*i/cols,.05,top(0),false,.02);
  const rows=Math.max(1,Math.round((top(0)-.05)/.18));
  for(let j=1;j<rows;j++){const y=.05+(top(0)-.05)*j/rows;beam(out,0,y,w,y,.02,.02)}
  return;
 }
 const gap=br>=.025?.11:.12,n=Math.max(2,Math.round(w/gap));
 for(let i=1;i<n;i++){
  const x=w*i/n,ty=box?top(0):(!noDeco&&d==="lana"&&i%2===0?top(x)-.1:top(x));
  bar(out,x,box?.05:.10,spikes?ty:ty-drop,round,br);
  if(spikes)spike(out,x,ty,S.tip);
  if(noDeco)continue;
  const cx=x+w/n/2,ry=top(x)-drop;
  if(d==="short"||m.n==="Lucca")bar(out,cx,.10,.10+Math.min(.28,H*.3),round,br*.8);
  if(["circle","c","s"].includes(d)&&i%2)ring(out,cx,ry-.1,Math.min(w/n/2,.05)*.8);
  if(d==="volute"&&i%3===1)ring(out,cx,ry-.1,.04);
  if(d==="rhomb"&&i%3===2){const q=.06,my=(ry+.10)/2;beam(out,x,my-q,x+q*.7,my,.01,.01);beam(out,x+q*.7,my,x,my+q,.01,.01);beam(out,x,my+q,x-q*.7,my,.01,.01);beam(out,x-q*.7,my,x,my-q,.01,.01)}
  if(d==="x"){beam(out,x,ry-.2,x+w/n,ry-.4,.01,.01);beam(out,x+w/n,ry-.2,x,ry-.4,.01,.01)}
 }
}
function offFactory(form,H,span0,spanW){
 const k=Math.min(H*.18,.22);
 return x=>{const t=Math.max(0,Math.min(1,(x+span0)/spanW)),s=Math.sin(Math.PI*t);
  return form==="Bogen"?k*s:form==="Geschwungen"?k*s*s:form==="U-Form"?-k*s:0};
}
function screenPanel(out,w,H){const g=new THREE.BoxGeometry(w,H-.06,.004);g.translate(w/2,(H-.06)/2+.04,0);out.push(g);
 beam(out,0,.04,w,.04,.03,.03);beam(out,0,H-.02,w,H-.02,.03,.03);beam(out,0,.04,0,H-.02,.03,.03);beam(out,w,.04,w,H-.02,.03,.03)}
/* 3D-Darstellung des gewählten Sichtschutz-Dekormotivs: eine transparente,
   mit dem echten Modellmuster (patBody) texturierte Zusatzfläche vor dem
   blickdichten Panel - sonst wäre die 3D-Ansicht immer nur ein glatter
   Kasten und würde (anders als die 2D-Zeichnung) nicht zeigen, welches
   Modell der Kunde gewählt hat. Spiegelt die 2D-Logik aus fence(): bei
   "teilflächig" sitzt das Muster nur im oberen Drittel, sonst vollflächig. */
const patTexCache={};
function patternTexture(pat,color){
 const key=pat+"|"+color;
 if(patTexCache[key])return patTexCache[key];
 const body=patBody(pat);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g style="stroke:${color};stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round">${body}</g></svg>`;
 const tex=new THREE.TextureLoader().load("data:image/svg+xml;utf8,"+encodeURIComponent(svg),()=>{try{update()}catch(e){}});
 tex.wrapS=tex.wrapT=THREE.RepeatWrapping;if("colorSpace" in tex)tex.colorSpace=THREE.SRGBColorSpace;
 patTexCache[key]=tex;return tex;
}
function patternPlane(w,H,m,screenVar,tileSize){
 if(!m.pat||m.pat==="none")return null;
 const margin=.012,top=H-.02,bot=.04,full=top-bot;
 const pTop=top-margin,pBot=(screenVar==="teil"&&m.p?top-full*.3:bot)+margin,ph=pTop-pBot,pw=Math.max(.02,w-2*margin);
 if(ph<=.01)return null;
 const g=new THREE.PlaneGeometry(pw,ph);g.translate(w/2,(pTop+pBot)/2,.0035);
 const uv=g.attributes.uv,ts=tileSize||.09;
 for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*pw/ts,uv.getY(i)*ph/ts);
 uv.needsUpdate=true;return g;
}

function place(list,mat4,dst){list.forEach(g=>{g.applyMatrix4(mat4);dst.push(g)})}
function frameMatrix(x,z,theta){return new THREE.Matrix4().makeTranslation(x,0,z).multiply(new THREE.Matrix4().makeRotationY(-theta))}

function buildGeometry(patOut){
 const L=layout(),m=model(),H=Math.max(.4,(+S.height||100)/100),all=[];
 const rail=isRail(),front=rail&&(S.mount==="Stirnseitig"||S.mount==="Vor der Fassade"),slab=rail?Math.max(.08,(+S.slab||18)/100):0;
 const P=L.post/100,postH=H+(S.product==="Tor"?.12:.04),postBot=front?-slab*.9:0;
 const post=(out,x)=>{const g=new THREE.BoxGeometry(P,postH-postBot,P);g.translate(x+P/2,(postH+postBot)/2,0);out.push(g);
  const c=new THREE.BoxGeometry(P*1.3,.012,P*1.3);c.translate(x+P/2,postH+.006,0);out.push(c);
  if(rail&&!front){const f=new THREE.BoxGeometry(P*2.2,.01,P*2.2);f.translate(x+P/2,.005,0);out.push(f)}
  /* "Zum Aufschrauben" (siehe Auswahl bei Pfosten im Maße-Schritt):
     sichtbare Aufschraubplatte + 4 Schraubenköpfe statt einfach nur Pfosten
     im Boden - macht die schon vorhandene Auswahl auch im 3D/AR-Modell
     sichtbar, bisher gab es dort keinen Unterschied zu "Einbetonieren". */
  else if(!rail&&S.posts==="Zum Aufschrauben"){
   const f=new THREE.BoxGeometry(P*2,.014,P*2);f.translate(x+P/2,.007,0);out.push(f);
   [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{const b=new THREE.CylinderGeometry(.006,.006,.02,8);b.translate(x+P/2+sx*P*.6,.016,sz*P*.6);out.push(b)});
  }};
 const showPosts=rail||S.posts!=="Keine Pfosten";
 /* Toranschlag-Beschläge (Bänder/Scharniere + Griff/Schloss), 3D:
    bisher wurde der Torflügel nur als durchgehende Stabfläche ohne jede
    Beschlag-Geometrie gezeichnet - die schon vorhandenen Auswahlfelder
    "Bänder sitzen" (S.hinge) und "Schloss" (S.lock) hatten keine sichtbare
    Auswirkung im 3D/AR-Modell. Scharniere kommen jetzt auf die gewählte
    Bandseite, Griff/Schließzylinder auf die gegenüberliegende Seite
    (sichtbar nur, wenn ein Schloss gewählt ist). */
 const hinges=(out,x,H)=>{[.2,.8].forEach(f=>{const g=new THREE.CylinderGeometry(.012,.012,.05,10);g.rotateX(Math.PI/2);g.translate(x,H*f,.025);out.push(g)})};
 const handleLock=(out,x,H)=>{
  const y=Math.min(H*.55,.95);
  const plate=new THREE.BoxGeometry(.03,.1,.012);plate.translate(x,y,.022);out.push(plate);
  const knob=new THREE.CylinderGeometry(.015,.015,.05,10);knob.rotateX(Math.PI/2);knob.translate(x,y,.045);out.push(knob);
  const cyl=new THREE.CylinderGeometry(.013,.013,.018,10);cyl.rotateX(Math.PI/2);cyl.translate(x,y+.09,.03);out.push(cyl);
 };
 if(L.gate){
  const loc=[],total=L.total/100,clear=L.clear/100,span0=P,off=offFactory(S.form,H,0,clear);
  if(showPosts){post(loc,0);post(loc,total-P)}
  const leaves=S.product==="Tor"?[[P+.02,(clear-.06)/2],[P+.04+(clear-.06)/2,(clear-.06)/2]]:[[P+.02,clear-.04]];
  const singleLeaf=leaves.length===1;
  leaves.forEach(([x0,w],li)=>{
   const l=[],o2=x=>off(x+x0-span0);run(l,m,w,H,o2);beam(l,0,.05,0,H+o2(0),.04,.04);beam(l,w,.05,w,H+o2(w),.04,.04);
   const hingeOnLeft=singleLeaf?S.hinge==="links":li===0;
   hinges(l,hingeOnLeft?0:w,H);
   if(S.lock!=="Ohne Schloss")handleLock(l,hingeOnLeft?w:0,H);
   place(l,new THREE.Matrix4().makeTranslation(x0,0,0),loc);
  });
  place(loc,new THREE.Matrix4(),all);
 }else{
  let ang=L.segs.map(()=>0);
  if(L.planned){ang=L.segs.map((_,i)=>{const a=S.pts[i],b=S.pts[i+1];return Math.atan2(b[1]-a[1],b[0]-a[0])})}
  let cx=0,cz=0;
  L.segs.forEach((g,i)=>{
   const loc=[],patLoc=[],per=g.per/100,step=per+P;
   for(let k=(i===0?0:1);k<=g.n;k++)if(showPosts)post(loc,k*step);
   for(let k=0;k<g.n;k++){
    const f=[],tr=new THREE.Matrix4().makeTranslation(k*step+P,0,0);
    if(isScreen()){screenPanel(f,per,H);
     if(patOut){const pg=patternPlane(per,H,m,S.screenVar);if(pg)place([pg],tr,patLoc)}
    }else run(f,m,per,H,offFactory(S.form,H,0,per));
    place(f,tr,loc);
   }
   if(patOut&&patLoc.length)place(patLoc,frameMatrix(cx,cz,ang[i]),patOut);
   place(loc,frameMatrix(cx,cz,ang[i]),all);
   const len=g.n*step;cx+=Math.cos(ang[i])*len;cz+=Math.sin(ang[i])*len;
  });
 }
 const geo=mergeGeometries(all,false);if(!geo)throw new Error("merge failed");
 all.forEach(g=>g.dispose());
 geo.computeBoundingBox();const b=geo.boundingBox;
 const cox=-(b.min.x+b.max.x)/2,coz=-(b.min.z+b.max.z)/2;
 geo.translate(cox,0,coz);
 if(patOut&&patOut.length){const off=new THREE.Matrix4().makeTranslation(cox,0,coz);patOut.forEach(g=>g.applyMatrix4(off))}
 return geo;
}

/* ---- 3D-Vorschau ---- */
let R=null;
function initView(){
 if(R)return R;
 const host=document.getElementById("v3d"),canvas=document.getElementById("c3d");
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
 const scene=new THREE.Scene();scene.background=new THREE.Color("#dfe7eb");
 const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
 const cam=new THREE.PerspectiveCamera(40,2,.05,200);
 const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
 Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,far:40});scene.add(sun,new THREE.HemisphereLight(0xdfefff,0x6d7f55,.8));
 const ground=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({color:"#8fae6e",roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 const controls=new OrbitControls(cam,canvas);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
 const resize=()=>{const w=host.clientWidth,h=Math.round(w*.5);if(!w)return;renderer.setSize(w,h,false);canvas.style.width=w+"px";canvas.style.height=h+"px";cam.aspect=w/h;cam.updateProjectionMatrix()};
 new ResizeObserver(resize).observe(host);resize();
 const loop=()=>{if(!host.hidden){controls.update();renderer.render(scene,cam)}requestAnimationFrame(loop)};loop();
 R={renderer,scene,cam,controls,mesh:null,patMesh:null,winGroup:null,fitted:""};return R;
}
let current=null;
function buildMesh(patOut){const mesh=new THREE.Mesh(buildGeometry(patOut),material());mesh.castShadow=true;mesh.name="Anlage";return mesh}
/* 3D-Hintergrund für den Französischen Balkon: ohne das stünde das Gitter
   in der 3D-Vorschau frei im Garten und wäre von einem normalen Geländer
   nicht zu unterscheiden - dabei ist ein Französischer Balkon immer die
   Absturzsicherung VOR einem bodentiefen Fenster (die 2D-Ansicht zeigt das
   schon, siehe scene()). Eigene, einfache Low-Poly-Darstellung (Wand,
   Glas, Sprosse, Fensterbank) - keine Fotos übernommen; als Gestaltungs-
   vorbild diente nur, wie ELEO-Modelle wie "Belluno" laut Katalog real vor
   Fenstern/Balkontüren montiert werden (in der Laibung zurückgesetzt bzw.
   auf Konsolen vor der Fassade), nicht deren Bildmaterial selbst.
   Spiegelt dieselbe Einrück-Logik wie die 2D-Ansicht (inL/ex in scene()). */
function buildWindowScenery(w,H){
 const inL=S.mount==="In der Laibung",exW=inL?.07:-w*.08,ww=Math.max(.3,w+2*exW);
 const wallZ=inL?.05:-.07,wallDepth=.18,glassZ=inL?wallZ-wallDepth:wallZ-.06;
 const top=H*1.85,bot=-H*.18,wallTop=top+.3,wallBot=bot-.1;
 const g=new THREE.Group();
 const wallMat=new THREE.MeshStandardMaterial({color:"#cdbfa8",roughness:.92});
 const wall=new THREE.Mesh(new THREE.BoxGeometry(ww+1.6,wallTop-wallBot,wallDepth),wallMat);
 wall.position.set(0,(wallTop+wallBot)/2,wallZ-wallDepth/2);wall.receiveShadow=true;g.add(wall);
 const glassMat=new THREE.MeshStandardMaterial({color:"#cfe0e6",roughness:.12,metalness:.1,transparent:true,opacity:.55});
 const glass=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.3,ww-.1),top-bot-.06,.02),glassMat);
 glass.position.set(0,(top+bot)/2,glassZ);g.add(glass);
 const frameMat=new THREE.MeshStandardMaterial({color:"#eef1f3",roughness:.5});
 const mull=new THREE.Mesh(new THREE.BoxGeometry(.05,top-bot,.04),frameMat);
 mull.position.set(0,(top+bot)/2,glassZ+.02);g.add(mull);
 const sill=new THREE.Mesh(new THREE.BoxGeometry(ww+.3,.04,wallDepth+(inL?.1:-.02)),wallMat);
 sill.position.set(0,bot,wallZ-wallDepth/2+(inL?0:.03));sill.receiveShadow=true;g.add(sill);
 return g;
}
/* Baut, falls Sichtschutz mit Dekormotiv gewählt ist, zusätzlich eine
   transparente "Muster"-Mesh vor dem Panel (siehe patternPlane()/patternTexture()
   oben) - eine zweite Mesh, weil sie ein eigenes, durchsichtiges Material
   braucht und nicht mit der blickdichten Hauptgeometrie verschmolzen werden kann. */
function buildPatternMesh(patArr){
 if(!patArr.length)return null;
 const geo=mergeGeometries(patArr,false);patArr.forEach(g=>g.dispose());if(!geo)return null;
 const tex=patternTexture(model().pat,finish().c);
 const mat=new THREE.MeshStandardMaterial({map:tex,transparent:true,alphaTest:.12,roughness:.85,metalness:.08,side:THREE.DoubleSide,color:0xffffff});
 const mesh=new THREE.Mesh(geo,mat);mesh.name="Muster";return mesh;
}
function disposeGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
function update(){
 const v=document.getElementById("v3d");if(!v||v.hidden)return;
 const r=initView();
 if(r.mesh){r.scene.remove(r.mesh);r.mesh.geometry.dispose()}
 if(r.patMesh){r.scene.remove(r.patMesh);r.patMesh.geometry.dispose();r.patMesh.material.dispose();r.patMesh=null}
 if(r.winGroup){r.scene.remove(r.winGroup);disposeGroup(r.winGroup);r.winGroup=null}
 const patArr=[];
 r.mesh=buildMesh(patArr);r.scene.add(r.mesh);
 r.patMesh=buildPatternMesh(patArr);if(r.patMesh)r.scene.add(r.patMesh);
 const b=new THREE.Box3().setFromObject(r.mesh),size=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 if(S.product==="Französischer Balkon"){
  r.winGroup=buildWindowScenery(size.x,Math.max(.4,(+S.height||100)/100));
  r.winGroup.position.set(c.x,0,c.z);r.scene.add(r.winGroup);
 }
 const key=S.product+L_key();
 if(r.fitted!==key){const dist=Math.max(size.x,size.z,size.y*2)*1.1+1.5;r.cam.position.set(c.x+dist*.35,size.y*1.4+dist*.25,c.z+dist);r.controls.target.set(c.x,size.y*.45,c.z);r.fitted=key}
 schedule();
}
function L_key(){const L=layout();return L.total+"|"+L.segs.length}

/* ---- USDZ für AR Quick Look ---- */
let timer=0,url="",busy=false;
function schedule(){clearTimeout(timer);setArState("busy");timer=setTimeout(prepare,500)}
async function prepare(){
 if(!AR_OK){setArState("na");return}
 if(busy){schedule();return}busy=true;
 try{
  const scene=new THREE.Scene();scene.add(buildMesh());
  const data=await new USDZExporter().parse(scene,{quickLookCompatible:true});
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(new Blob([data],{type:"model/vnd.usdz+zip"}));
  setArState("ok");
 }catch(e){console.warn(e);setArState("err")}finally{busy=false}
}
function setArState(st){
 document.querySelectorAll("a[data-ar]").forEach(a=>{
  a.classList.toggle("ready",st==="ok");
  if(st==="ok"){a.setAttribute("href",url+"#allowsContentScaling=0")}else a.removeAttribute("href");
  const s=a.querySelector("span");if(s)s.textContent=st==="ok"?"In AR ansehen":st==="busy"?"AR wird vorbereitet …":st==="na"?"AR nur in Safari (iPad/iPhone)":"AR-Fehler, erneut versuchen";
 });
 document.querySelectorAll("[data-arhint]").forEach(p=>p.hidden=st!=="na");
}
window.SV3D={update,prepare:()=>{if(!AR_OK){setArState("na");return}url?setArState("ok"):schedule()},invalidate:()=>{if(url){URL.revokeObjectURL(url);url=""}},AR_OK};
document.dispatchEvent(new Event("sv3d-ready"));
</script>
